blueprint:
  name: "FaceID: put the recognised name into your Frigate notification"
  description: >-
    Sends a notification when FaceID recognises someone — and, if you give it the same
    notification **tag** your Frigate blueprint uses, it *replaces* that earlier
    notification instead of adding a second one.


    **Why this is needed.** A Frigate notification blueprint fires when the event starts.
    FaceID needs a moment longer: it has to wait for a snapshot to exist, find a face in it
    and match it. Measured over 132 real recognitions on one household setup, the name is
    ready after a median of 7 seconds — 3 seconds at the very best, because that is how long
    Frigate itself takes to produce the first snapshot.


    **Correction (2026-08-31).** An earlier version of this text claimed Frigate never
    publishes the name over MQTT. That was wrong, and the test behind it was flawed — it
    was run against an event that had already ended, where Frigate sends nothing more.
    On a *running* event, Frigate 0.17.2 does forward it, in the very same second:
    `after.sub_label` = `["Eli", 0.514]`, a two-element array of name and score.


    Why a Frigate blueprint may still not show it: at least one popular one reads
    `after.data.sub_labels`, which is `null` on 0.17.2 — the name is in the payload, just
    not where it is being looked for.


    This blueprint sidesteps that entirely. It triggers on FaceID's own `faceid/event`
    topic, so it does not depend on which Frigate version puts the name where, and it also
    carries the score and the Frigate zones. It updates the notification once the name is
    known.
  domain: automation
  source_url: https://github.com/SkyTechNerds/faceid/blob/main/blueprints/faceid-name-the-person.yaml
  input:
    notify_device:
      name: Phone or tablet
      description: >-
        Pick the device to notify. Leave empty if you use a notification group, or if the
        service name below is set.
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app

    notify_service:
      name: ...or a notification service by name
      description: >-
        e.g. `notify.mobile_app_your_phone` or `notify.family_group`. **If this is filled
        in it wins over the device above.**


        Use it whenever the device picker cannot be trusted: the service name is derived
        from the device name, so **two devices with the same name are indistinguishable**
        (one of them really is `notify.mobile_app_iphone_2`), and renaming a device after
        it was registered breaks the derivation too. It is also the only way to reach a
        notification group. Whatever you choose, use the same target your Frigate blueprint
        uses — otherwise the message cannot replace the earlier one.
      default: ""
      selector:
        text:

    notification_tag:
      name: Notification tag
      description: >-
        **This is what makes the update replace the first message** instead of stacking a
        second one. Use the same tag your Frigate notification blueprint sets. The default
        is the Frigate event id, which is what most of them use. Templates are allowed.
      default: "{{ trigger.payload_json.event_id }}"
      selector:
        text:

    image_source:
      name: Where the snapshot comes from
      description: >-
        **Home Assistant** is the right answer for almost everyone: the notification then
        carries the relative path `/api/frigate/notifications/<event>/snapshot.jpg`, which
        your phone resolves against its own Home Assistant connection — so it works at home
        and away, with no Frigate address involved at all. Needs the Frigate integration
        with its notification proxy enabled.


        ⚠️ **The usual cause of a missing image** is entering a Frigate address the *phone*
        cannot reach. `http://ccab4aaf-frigate:5000` and similar add-on hostnames only exist
        inside Home Assistant; the phone fetches the picture itself and gets nothing —
        neither at home nor away.
      default: ha_proxy
      selector:
        select:
          options:
            - label: Home Assistant (recommended)
              value: ha_proxy
            - label: A Frigate address I enter below
              value: frigate_url
            - label: No image
              value: none

    frigate_url:
      name: Frigate address (only for the option above)
      description: >-
        Only used if you picked *A Frigate address*. It must be reachable **from the phone**,
        e.g. `http://192.168.1.10:5000` — not an add-on hostname.
      default: ""
      selector:
        text:

    cameras:
      name: Only these cameras
      description: >-
        Pick the Frigate cameras this should apply to. Leave empty for all of them.
        The real Frigate camera name is read from each entity's `camera_name` attribute,
        so renaming the entity in Home Assistant does not break the filter.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: camera
              integration: frigate

    required_zone:
      name: Only in this Frigate zone
      description: >-
        Leave empty to ignore zones. ⚠️ Careful: an event carries no zone at all far more
        often than you would expect — on the reference setup 12 of 28 correct recognitions
        had an empty zone list, because being visible in an area and being counted as inside
        a zone are different things. This condition requires the zone to be **present**, so
        events without zone information stay silent.
      default: ""
      selector:
        text:

    report_known:
      name: Notify for people you know
      default: true
      selector:
        boolean:

    report_unknown:
      name: Notify for strangers
      description: >-
        FaceID publishes strangers on the same topic as `person: unknown`. Off by default —
        your Frigate blueprint has usually already announced that someone is there, and the
        point of this automation is to add a *name*.
      default: false
      selector:
        boolean:

    message_known:
      name: Message for a known person
      default: "{{ person }} is at the {{ camera }}"
      selector:
        text:

    message_unknown:
      name: Message for a stranger
      default: "Someone unrecognised is at the {{ camera }}"
      selector:
        text:

mode: queued
max: 10

triggers:
  - trigger: mqtt
    topic: faceid/event

variables:
  person: "{{ trigger.payload_json.person }}"
  camera: "{{ trigger.payload_json.camera }}"
  score: "{{ trigger.payload_json.score | default(0) }}"
  zones: "{{ trigger.payload_json.zones | default([]) }}"
  event_id: "{{ trigger.payload_json.event_id }}"
  is_unknown: "{{ trigger.payload_json.person == 'unknown' }}"
  cameras: !input cameras
  required_zone: !input required_zone
  report_known: !input report_known
  report_unknown: !input report_unknown
  frigate_url: !input frigate_url
  image_source: !input image_source
  message_known: !input message_known
  message_unknown: !input message_unknown
  notify_device: !input notify_device
  notify_service: !input notify_service
  tag: !input notification_tag

conditions:
  - condition: template
    # Aus den gewaehlten Entities die echten Frigate-Kameranamen machen. Bevorzugt aus
    # dem Attribut camera_name; ist die Kamera gerade nicht verfuegbar, fehlen die
    # Attribute — dann greift der Objektteil der entity_id als Rueckfallebene.
    value_template: >-
      {% set ns = namespace(names=[]) %}
      {% for e in cameras %}
        {% set ns.names = ns.names + [state_attr(e, 'camera_name') or e.split('.')[1]] %}
      {% endfor %}
      {{ cameras | length == 0 or camera in ns.names }}
  - condition: template
    value_template: "{{ required_zone == '' or required_zone in zones }}"
  - condition: template
    value_template: "{{ report_unknown if is_unknown else report_known }}"
  - condition: template
    # Ohne Ziel wuerde die Aktion mit einer unverstaendlichen Fehlermeldung abbrechen.
    value_template: "{{ notify_service != '' or notify_device != '' }}"

actions:
  # Einzeilig UND getrimmt: bei mehrzeiligem >- macht YAML aus dem Umbruch ein
  # Leerzeichen, und "notify.family_group " mit Leerzeichen ist kein gueltiger Dienst.
  - action: "{% if notify_service %}{{ notify_service }}{% else %}notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}{% endif %}"

    data:
      title: FaceID
      message: >-
        {% if is_unknown %}{{ message_unknown }}{% else %}{{ message_known }}{% endif %}
      # Android und iOS erwarten das Bild an VERSCHIEDENEN Stellen: Android liest
      # data.image, iOS data.attachment.url. Beide zu setzen ist der uebliche Weg —
      # jede Plattform ignoriert das Feld der anderen. Wird keine Frigate-URL
      # angegeben, duerfen beide Felder gar nicht erst auftauchen: ein leeres
      # attachment laesst die Meldung auf iOS fehlschlagen.
      data: >-
        {% set base = {'tag': tag, 'channel': 'FaceID'} %}
        {% if image_source == 'ha_proxy' %}
          {% set url = '/api/frigate/notifications/' ~ event_id ~ '/snapshot.jpg' %}
        {% elif image_source == 'frigate_url' and frigate_url %}
          {% set url = frigate_url ~ '/api/events/' ~ event_id ~ '/snapshot.jpg' %}
        {% else %}
          {% set url = '' %}
        {% endif %}
        {% if url %}
          {{ dict(base, image=url, attachment={'url': url, 'content-type': 'jpeg'}) }}
        {% else %}
          {{ base }}
        {% endif %}
