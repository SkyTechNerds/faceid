# Example: phone notification when a family member is recognized.
#
# One faceid/event message is published per (Frigate event, person), so this
# will not spam you with repeats of the same sighting. mode: queued makes sure
# two people recognized at the same time both produce a notification; the
# per-person notification tag replaces a still-visible message instead of
# stacking. faceid/event is published without the MQTT retain flag, so a
# Home Assistant restart cannot re-fire these triggers on a stale message.

- alias: 'FaceID: family member recognized'
  id: faceid_family_recognized
  mode: queued
  triggers:
  - trigger: mqtt
    topic: faceid/event
    value_template: '{{ value_json.person }}'
    payload: Alice
  - trigger: mqtt
    topic: faceid/event
    value_template: '{{ value_json.person }}'
    payload: Bob
  variables:
    frigate_url: http://192.168.1.10:5000
    camera_name: >-
      {{ {'front_door': 'front door', 'garden': 'garden'}
         .get(trigger.payload_json.camera, trigger.payload_json.camera) }}
  actions:
  - action: notify.mobile_app_your_phone
    data:
      title: '{{ trigger.payload_json.person }} is here'
      message: >-
        {{ trigger.payload_json.person }} recognized at the {{ camera_name }}
        ({{ ((trigger.payload_json.score | default(0)) * 100) | round(0) | int }} %).
      data:
        channel: FaceID
        tag: faceid-{{ trigger.payload_json.person | lower }}
        image: '{{ frigate_url }}/api/events/{{ trigger.payload_json.event_id }}/snapshot.jpg'

# Example: alert only for STRANGERS, and only in the zone you care about.
#
# Every faceid/event carries `zones` — the Frigate zones that person entered
# during the event. Unknown faces are published as person: unknown, so one topic
# covers both cases: notify for strangers in the driveway, stay silent for the
# street, and never notify for people you know.
#
# IMPORTANT: an empty `zones` is not "outside every zone". It looks the same
# whether the camera has no zones at all or Frigate never registered the person
# in one — which happens more often than you would expect (12 of 28 correct
# recognitions on one zoned camera here carried no zone). This automation
# therefore requires the zone to be PRESENT rather than testing that it is
# absent, so an unknown location stays quiet instead of alerting. Flip that if
# you would rather get a false alarm than miss someone.
#
# If you want strict zone gating, do it in Frigate instead:
#   snapshots: { required_zones: [driveway] }
# FaceID only acts on events that have a snapshot, so those never reach it at all.

- alias: 'FaceID: stranger in the driveway'
  id: faceid_stranger_driveway
  mode: queued
  triggers:
  - trigger: mqtt
    topic: faceid/event
    value_template: '{{ value_json.person }}'
    payload: unknown
  conditions:
  - condition: template
    value_template: "{{ 'driveway' in (trigger.payload_json.zones | default([])) }}"
  variables:
    frigate_url: http://192.168.1.10:5000
  actions:
  - action: notify.mobile_app_your_phone
    data:
      title: Unknown person in the driveway
      message: >-
        Someone FaceID does not recognize
        ({{ ((trigger.payload_json.score | default(0)) * 100) | round(0) | int }} % to the
        closest known face).
      data:
        channel: FaceID
        tag: faceid-stranger-{{ trigger.payload_json.camera }}
        image: '{{ frigate_url }}/api/events/{{ trigger.payload_json.event_id }}/snapshot.jpg'
