name: FaceID
version: "0.27.1"
slug: faceid
description: Face recognition for Frigate — trainable gallery, clustered unknown review, HA sensors
url: https://github.com/SkyTechNerds/faceid
arch:
  - amd64
  - aarch64
startup: application
hassio_api: true
boot: auto
init: false
ingress: true
ingress_port: 8600
panel_icon: mdi:face-recognition
panel_title: FaceID
ports:
  8600/tcp: null
ports_description:
  8600/tcp: Web UI without ingress (optional)
# Nur lesend: FaceID veraendert und loescht die beobachteten Aufnahmen nie. Ohne diese
# beiden Einhaengungen sieht die App /media und /share ueberhaupt nicht — genau daran
# scheitert der Ordner-Eingang in der App, nicht an fehlenden Optionen.
map:
  - media:ro
  # share schreibend: Ziel fuer das eingebaute Galerie-Backup (backup_dir). Die Galerie
  # ist das eine, was sich nicht wiederherstellen laesst — und /share liegt in den
  # meisten HA-Backups ohnehin drin, anders als das Daten-Volume der App.
  #
  # Home Assistant kennt keinen engeren Mount als den ganzen Baum: share:rw ist alles
  # oder nichts. Eingegrenzt wird deshalb die Nutzung, nicht die Einhaengung — run.sh
  # laesst als backup_dir nur /share und /data zu, geschrieben wird allein in dieses
  # eine Verzeichnis, und geloescht werden ausschliesslich eigene Archive
  # (faceid-backup-*.tar.gz). addon_config:rw waere enger, verschwindet aber mit der
  # App und taugt damit nicht als Sicherung.
  - share:rw
# Der Modell-Cache ist rund 600 MB und laedt sich beim naechsten Start von selbst neu.
# Ohne diese Zeile steckt er in jedem Home-Assistant-Backup, obwohl er nichts enthaelt,
# was verloren gehen koennte.
backup_exclude:
  - model-cache
  - model-cache/**
services:
  - mqtt:want
options:
  mqtt_prefix: faceid
  frigate_user: ""
  frigate_password: ""
  frigate_url: http://192.168.1.10:5000
  go2rtc_url: ""
  go2rtc_user: ""
  go2rtc_password: ""
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  match_threshold: 0.5
  unknown_threshold: 0.35
  cluster_eps: 0.55
  suggest_threshold: 0.40
  min_face_px: 48
  det_size: 640
  max_attempts: 6
  max_faces_per_person: 40
  trimmed_keep: 10
  dedupe_threshold: 0.65
  cross_risk_margin: 0.05
  self_outlier_ratio: 0.25
  history_keep: 200
  hires_enroll: true
  clip_fallback: true
  clip_fallback_cameras: []
  live_hires_fallback: false
  live_hires_fallback_cameras: []
  live_hires_mode: fallback
  live_hires_cooldown: 2
  frigate_topic_prefix: frigate
  poll_interval: 0
  backup_enabled: false
  backup_hour: 3
  backup_keep: 7
  backup_dir: ""
  presence_window: 120
  set_sub_label: true
  cameras: []
  discovery_cameras: []
  folder_enabled: false
  folder_path: /media/faceid
  folder_camera: front_door
  folder_recursive: true
  folder_process_existing: true
  folder_extensions:
    - .mp4
    - .mkv
    - .mov
    - .avi
    - .webm
    - .m4v
  folder_poll_interval: 10
  folder_settle_seconds: 10
  folder_max_frames: 24
  folder_max_people_per_file: 6
  folder_max_indexed_files: 5000
schema:
  mqtt_prefix: str
  frigate_url: url?
  mqtt_host: str?
  mqtt_port: port
  frigate_user: str?
  frigate_password: password?
  go2rtc_url: url?
  go2rtc_user: str?
  go2rtc_password: password?
  mqtt_user: str?
  mqtt_password: password?
  match_threshold: float(0.2,0.9)
  unknown_threshold: float(0.1,0.8)
  cluster_eps: float(0.3,0.8)
  suggest_threshold: float(0.1,0.9)
  min_face_px: int(16,200)
  det_size: int(320,1280)
  max_attempts: int(1,20)
  max_faces_per_person: int(5,100)
  trimmed_keep: int(0,100)
  dedupe_threshold: float(0.50,0.95)
  cross_risk_margin: float(-1,0.5)
  self_outlier_ratio: float(-1,0.9)
  history_keep: int(0,2000)
  hires_enroll: bool
  clip_fallback: bool
  clip_fallback_cameras:
    - str
  live_hires_fallback: bool
  live_hires_fallback_cameras:
    - str
  live_hires_mode: list(fallback|always)
  live_hires_cooldown: float(0,60)
  frigate_topic_prefix: str?
  poll_interval: int(0,3600)
  backup_enabled: bool
  backup_hour: int(0,23)
  backup_keep: int(1,90)
  backup_dir: str?
  presence_window: int(10,3600)
  set_sub_label: bool
  cameras:
    - str
  discovery_cameras:
    - str
  folder_enabled: bool
  folder_path: str?
  folder_camera: str?
  folder_recursive: bool
  folder_process_existing: bool
  folder_extensions:
    - str
  folder_poll_interval: int(1,3600)
  folder_settle_seconds: int(0,600)
  folder_max_frames: int(1,120)
  folder_max_people_per_file: int(1,20)
  folder_max_indexed_files: int(0,200000)
