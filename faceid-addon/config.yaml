name: FaceID
version: "0.6.12"
slug: faceid
description: Face recognition for Frigate — trainable gallery, clustered unknown review, HA sensors
url: https://github.com/SkyTechNerds/faceid
arch:
  - amd64
  - aarch64
startup: application
hassio_api: true
boot: auto
init: false
ingress: true
ingress_port: 8600
panel_icon: mdi:face-recognition
panel_title: FaceID
ports:
  8600/tcp: null
ports_description:
  8600/tcp: Web UI without ingress (optional)
services:
  - mqtt:want
options:
  mqtt_prefix: faceid
  frigate_url: http://192.168.1.10:5000
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  match_threshold: 0.5
  unknown_threshold: 0.35
  cluster_eps: 0.55
  suggest_threshold: 0.40
  max_faces_per_person: 40
  trimmed_keep: 10
  dedupe_threshold: 0.65
  hires_enroll: true
  frigate_topic_prefix: frigate
  poll_interval: 0
  backup_enabled: false
  backup_hour: 3
  backup_keep: 7
  presence_window: 120
  set_sub_label: true
  cameras: []
  discovery_cameras: []
schema:
  mqtt_prefix: str
  frigate_url: url
  mqtt_host: str?
  mqtt_port: port
  mqtt_user: str?
  mqtt_password: password?
  match_threshold: float(0.2,0.9)
  unknown_threshold: float(0.1,0.8)
  cluster_eps: float(0.3,0.8)
  suggest_threshold: float(0.1,0.9)
  max_faces_per_person: int(5,100)
  trimmed_keep: int(0,100)
  dedupe_threshold: float(0.50,0.95)
  hires_enroll: bool
  frigate_topic_prefix: str?
  poll_interval: int(0,3600)
  backup_enabled: bool
  backup_hour: int(0,23)
  backup_keep: int(1,90)
  presence_window: int(10,3600)
  set_sub_label: bool
  cameras:
    - str
  discovery_cameras:
    - str
